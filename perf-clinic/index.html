<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Activity</title>
  <!-- PERF #7: a 327 KB utility stylesheet (css/theme.css) was linked here. No class or
       selector in it matched anything on the page (identical computed styles for all
       1,772 elements without it), but as a stylesheet it blocked first paint. Removed. -->
  <link rel="stylesheet" href="css/app.css">
  <!-- PERF #6: config.js builds 100,000 events. As a classic script in <head> it blocked
       the parser, so nothing could paint until it finished. `defer` lets the page parse
       and paint first; deferred scripts still run in document order, after parsing. -->
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="read-progress" class="read-progress"></div>
  <header class="topbar">
    <h1 class="brand">Agent Activity</h1>
    <input id="search" class="search" type="search" placeholder="Search tool calls" aria-label="Search tool calls">
    <span id="scroll-context" class="scroll-context"></span>
    <button id="ticker-toggle" class="button" type="button" aria-pressed="false">Show live calls</button>
  </header>

  <main>
    <section class="hero">
      <!-- PERF #3: the hero was a 4.27 MB, 1700 px PNG for every screen, and the page's
           Largest Contentful Paint. Now: AVIF/WebP in four widths (the browser picks one for
           its screen; ~90 KB at a typical laptop width), a JPEG fallback, width/height so its
           space is reserved before any bytes arrive (no layout shift), and fetchpriority=high
           because it is the LCP element. -->
      <picture>
        <source type="image/avif" sizes="calc(100vw - 64px)"
                srcset="assets/hero-640.avif 640w,
                assets/hero-1024.avif 1024w,
                assets/hero-1440.avif 1440w,
                assets/hero-1700.avif 1700w">
        <source type="image/webp" sizes="calc(100vw - 64px)"
                srcset="assets/hero-640.webp 640w,
                assets/hero-1024.webp 1024w,
                assets/hero-1440.webp 1440w,
                assets/hero-1700.webp 1700w">
        <img class="hero-image" src="assets/hero-1440.jpg" width="1700" height="950"
             alt="Abstract visual of agent traffic" fetchpriority="high">
      </picture>
      <div class="hero-copy">
        <h2>Every tool call, every agent</h2>
        <p>See what your AI agents did today, which tools they reached for, and what was blocked.</p>
      </div>
    </section>

    <section class="alerts" aria-label="Alerts">
      <div class="alerts-track">
        <span class="alert-pill">3 calls blocked by policy in the last hour</span>
        <span class="alert-pill">support-triage latency above 2s</span>
        <span class="alert-pill">New agent registered: churn-predictor</span>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Agents</h2>
      <div id="agents" class="agent-grid"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2 class="section-title">Recent tool calls</h2>
        <span id="results-count" class="results-count"></span>
      </div>
      <ul id="results" class="results"></ul>
    </section>
  </main>

  <div id="row-preview" class="row-preview" hidden></div>
  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">↑</button>

</body>
</html>
